name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q byteguard tests
      - run: python -m unittest discover -s tests -v

  e2e:
    name: End to end (${{ matrix.os }}, ${{ matrix.firewall }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        firewall: [iptables, ufw]
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/build.py
      - run: shellcheck --severity=warning dist/byteguard.sh
      - if: matrix.firewall == 'ufw'
        run: sudo ufw --force enable
      - run: sudo bash tests/e2e/run.sh dist/byteguard.sh

  syntax-check:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: warning

  shfmt:
    name: shfmt formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mfinelli/setup-shfmt@v4
      - run: shfmt -i 2 -ci -d .
